<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Mesa de Ayuda - SIES Salud</title>

        <!-- Tipografía corporativa (Montserrat) -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />

        <!-- Select2 CSS -->
        <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />

        <style>
            :root {
                /* Paleta Corporativa SIES Salud */
                --sies-azul-oscuro: #223666;
                --sies-verde-lima: #bdca44;
                --sies-azul-medio: #184f9d;
                --sies-cyan: #00abc8;
                --sies-verde-activo: #55a537;

                /* Colores Neutros y Estilo Base */
                --bg-color: #f4f6f9;
                --card-bg: #ffffff;
                --text-main: #223666;
                --text-muted: #666666;
                --border-color: #e1e4e8;
                --required-color: #d9534f;
                --radius: 8px;
                --shadow: 0 4px 15px rgba(34, 54, 102, 0.08);
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                font-family: "Montserrat", Arial, sans-serif;
                background-color: var(--bg-color);
                color: var(--text-main);
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                padding: 20px;
            }

            .form-container {
                background-color: var(--card-bg);
                width: 100%;
                max-width: 650px;
                border-radius: var(--radius);
                box-shadow: var(--shadow);
                overflow: hidden;
                border: 1px solid var(--border-color);
            }

            /* Cabezote dinámico SIES Salud */
            .form-header {
                background: linear-gradient(135deg, var(--sies-azul-oscuro) 0%, var(--sies-azul-medio) 100%);
                color: #ffffff;
                padding: 28px 32px;
                text-align: left;
                position: relative;
                border-bottom: 4px solid var(--sies-verde-lima);
            }

            .form-header-badge {
                display: inline-block;
                background-color: var(--sies-cyan);
                color: #ffffff;
                font-size: 11px;
                font-weight: 700;
                text-transform: uppercase;
                padding: 4px 10px;
                border-radius: 12px;
                margin-bottom: 10px;
                letter-spacing: 0.5px;
            }

            .form-header h2 {
                font-size: 22px;
                font-weight: 700;
                margin-bottom: 6px;
                letter-spacing: 0.2px;
            }

            .form-header p {
                font-size: 13px;
                opacity: 0.92;
                font-weight: 400;
                line-height: 1.4;
            }

            .form-body {
                padding: 32px;
            }

            .form-group {
                margin-bottom: 22px;
                display: flex;
                flex-direction: column;
            }

            .form-group label {
                font-size: 13px;
                font-weight: 600;
                color: var(--sies-azul-oscuro);
                margin-bottom: 8px;
            }

            .form-group label .required {
                color: var(--required-color);
                margin-left: 3px;
            }

            .form-control {
                width: 100%;
                padding: 11px 14px;
                font-size: 14px;
                font-family: "Montserrat", Arial, sans-serif;
                color: #333333;
                background-color: #ffffff;
                border: 1px solid #cccccc;
                border-radius: var(--radius);
                transition: all 0.2s ease;
                outline: none;
            }

            .form-control:focus {
                border-color: var(--sies-cyan);
                box-shadow: 0 0 0 3px rgba(0, 171, 200, 0.18);
            }

            textarea.form-control {
                resize: vertical;
                min-height: 100px;
            }

            select.form-control {
                appearance: none;
                background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23223666' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
                background-repeat: no-repeat;
                background-position: right 14px center;
                background-size: 16px;
                padding-right: 40px;
            }

            /* Estilos Personalizados para Carga de Archivos */
            .attachment-wrapper {
                border: 2px dashed var(--sies-cyan);
                padding: 24px 15px;
                border-radius: var(--radius);
                background-color: rgba(0, 171, 200, 0.03);
                text-align: center;
                position: relative;
            }

            .btn-attach-container {
                position: relative;
                display: inline-block;
                margin-bottom: 10px;
            }

            .btn-attach {
                display: inline-block;
                background-color: var(--sies-azul-oscuro);
                color: #ffffff;
                padding: 10px 22px;
                font-size: 13px;
                font-weight: 600;
                border-radius: 6px;
                transition: background 0.2s;
                cursor: pointer;
            }

            .btn-attach-container:hover .btn-attach {
                background-color: var(--sies-azul-medio);
            }

            .wtcuploadinput {
                cursor: pointer;
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                opacity: 0;
                z-index: 10;
            }

            .file-info-text {
                font-size: 11px;
                color: var(--text-muted);
                display: block;
                margin-top: 4px;
            }

            #zsFileBrowseAttachments {
                margin-top: 15px;
                text-align: left;
                display: flex;
                flex-direction: column;
                gap: 8px;
            }

            .filenamecls {
                font-size: 13px;
                background: #ffffff;
                border: 1px solid var(--sies-cyan);
                padding: 8px 14px;
                border-radius: 6px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                box-shadow: 0 2px 5px rgba(0,0,0,0.05);
                animation: fadeIn 0.3s ease-in-out;
            }

            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(-5px); }
                to { opacity: 1; transform: translateY(0); }
            }

            .filenamecls span {
                color: var(--sies-azul-oscuro);
                font-weight: 500;
                word-break: break-all;
            }

            .filenamecls a {
                color: var(--required-color);
                text-decoration: none;
                font-weight: bold;
                font-size: 14px;
                margin-left: 12px;
                padding: 2px 6px;
                border-radius: 50%;
                transition: background 0.2s;
            }

            .filenamecls a:hover {
                background-color: #fde8e8;
            }

            /* Personalización de Select2 */
            .select2-container--default .select2-selection--single {
                height: 44px;
                border: 1px solid #cccccc;
                border-radius: var(--radius);
                padding: 6px 8px;
                display: flex;
                align-items: center;
            }

            .select2-container--default .select2-selection--single .select2-selection__rendered {
                color: #333333;
                font-family: "Montserrat", Arial, sans-serif;
                font-size: 13px;
                line-height: 28px;
            }

            .select2-container--default .select2-selection--single .select2-selection__arrow {
                height: 42px;
                right: 10px;
            }

            .select2-container--default.select2-container--open .select2-selection--single {
                border-color: var(--sies-cyan);
                box-shadow: 0 0 0 3px rgba(0, 171, 200, 0.18);
            }

            .select2-dropdown {
                border-color: var(--sies-cyan);
                border-radius: var(--radius);
                box-shadow: 0 4px 12px rgba(34, 54, 102, 0.12);
                font-family: "Montserrat", Arial, sans-serif;
                font-size: 13px;
            }

            .select2-container--default .select2-search--dropdown .select2-search__field {
                border: 1px solid var(--border-color);
                border-radius: 4px;
                padding: 8px 12px;
                outline: none;
                font-family: "Montserrat", Arial, sans-serif;
            }

            .select2-container--default .select2-results__option--highlighted[aria-selected] {
                background-color: var(--sies-azul-oscuro);
                color: #ffffff;
            }

            .form-actions {
                display: flex;
                gap: 12px;
                justify-content: flex-end;
                margin-top: 30px;
                padding-top: 22px;
                border-top: 1px solid #eeeeee;
            }

            .btn {
                padding: 12px 24px;
                font-size: 14px;
                font-family: "Montserrat", Arial, sans-serif;
                font-weight: 600;
                border-radius: var(--radius);
                cursor: pointer;
                transition: all 0.2s ease;
                border: none;
            }

            .btn-primary {
                background-color: var(--sies-verde-lima);
                color: var(--sies-azul-oscuro);
                font-weight: 700;
            }

            .btn-primary:hover {
                background-color: #aebd3b;
                box-shadow: 0 2px 8px rgba(189, 202, 68, 0.4);
            }

            .btn-primary:disabled {
                background-color: #e0e5b3;
                color: #888888;
                cursor: not-allowed;
                box-shadow: none;
            }

            .btn-secondary {
                background-color: #f8f9fa;
                color: var(--sies-azul-oscuro);
                border: 1px solid #d1d5db;
            }

            .btn-secondary:hover {
                background-color: #e9ecef;
            }
        </style>

        <!-- jQuery y dependencias Encoder Zoho -->
        <script src="https://static.zohocdn.com/zohodeskstatic/app/js/jqueryandencoder.ef05974972bf3bca1b87.js"></script>
        <!-- Select2 JS -->
        <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

        <script>
            window.addEventListener("pageshow", function () {
                const submitButton = document.getElementById("zsSubmitButton_553872000013503219");
                if (submitButton) {
                    submitButton.removeAttribute("disabled");
                }
                const captchaTextField = document.forms["zsWebToCase_553872000013503219"]["zsWebFormCaptchaWord"];
                if (window.zsRegenerateCaptcha && captchaTextField && captchaTextField.value) {
                    captchaTextField.value = "";
                    captchaTextField.focus();
                    zsRegenerateCaptcha();
                }
            });

            function trimBoth(str) {
                return jQuery.trim(str);
            }

            function setAllDependancyFieldsMapping() {
                var mapDependancyLabels = getMapDependenySelectValues(
                    jQuery("[id='property(module)']").val(),
                    "JSON_MAP_DEP_LABELS"
                );
                if (mapDependancyLabels) {
                    for (var i = 0; i < mapDependancyLabels.length; i++) {
                        var label = mapDependancyLabels[i];
                        var obj = document.forms["zsWebToCase_553872000013503219"][label];
                        if (obj) {
                            setDependent(obj, true);
                        }
                    }
                }
            }

            function getMapDependenySelectValues(module, key) {
                var dependencyObj = jQuery.parseJSON(jQuery("[id='dependent_field_values_" + module + "']").val());
                if (dependencyObj == undefined) {
                    return dependencyObj;
                }
                return dependencyObj[key];
            }

            function setDependent(obj, isload) {
                var name = obj.id || (obj[0] && obj[0].id) || "";
                var module = jQuery("[id='property(module)']").val();
                var val = "";
                var myObject = getMapDependenySelectValues(module, "JSON_VALUES");
                if (myObject != undefined) {
                    val = myObject[name];
                }
                var mySelObject = getMapDependenySelectValues(module, "JSON_SELECT_VALUES");
                if (val != null && val != "" && val != "null" && mySelObject) {
                    var fields = val;
                    for (var i in fields) {
                        if (fields.hasOwnProperty(i)) {
                            var isDependent = false;
                            var label = i;
                            var values = fields[i];
                            if (label.indexOf(")") > -1) {
                                label = label.replace(/\)/g, "_____");
                            }
                            if (label.indexOf("(") > -1) {
                                label = label.replace(/\(/g, "____");
                            }
                            if (label.indexOf(".") > -1) {
                                label = label.replace(/\./g, "___");
                            }
                            var depObj = document.forms["zsWebToCase_553872000013503219"][label];
                            if (depObj && depObj.options) {
                                var mapValues = "";
                                var selected_val = depObj.value;
                                var depLen = depObj.options.length - 1;
                                for (var n = depLen; n >= 0; n--) {
                                    if (depObj.options[n].selected) {
                                        if (mapValues == "") {
                                            mapValues = depObj.options[n].value;
                                        } else {
                                            mapValues = mapValues + ";;;" + depObj.options[n].value;
                                        }
                                    }
                                }
                                depObj.value = "";
                                var selectValues = mySelObject[label];
                                for (var k in values) {
                                    var rat = k;
                                    if (rat == "-None-") {
                                        rat = "";
                                    }
                                    var parentValues = mySelObject[name];
                                    if (rat == trimBoth(obj.value)) {
                                        isDependent = true;
                                        depObj.length = 0;
                                        var depvalues = values[k];
                                        var depLen = depvalues.length - 1;
                                        for (var j = 0; j <= depLen; j++) {
                                            var optionElement = document.createElement("OPTION");
                                            var displayValue = depvalues[j];
                                            var actualValue = displayValue;
                                            if (actualValue == "-None-") {
                                                optionElement.value = "";
                                                displayValue = "-None-";
                                            } else {
                                                optionElement.value = actualValue;
                                            }
                                            optionElement.text = displayValue;
                                            if (mapValues != undefined) {
                                                var mapValue = mapValues.split(";;;");
                                                var len = mapValue.length;
                                                for (var p = 0; p < len; p++) {
                                                    if (actualValue == mapValue[p]) {
                                                        optionElement.selected = true;
                                                    }
                                                }
                                            }
                                            depObj.options.add(optionElement);
                                        }
                                    }
                                }
                                if (!isDependent) {
                                    depObj.length = 0;
                                    var len = selectValues.length;
                                    for (var j = 0; j < len; j++) {
                                        var actualValue = selectValues[j];
                                        var optionElement = document.createElement("OPTION");
                                        if (actualValue == "-None-") {
                                            optionElement.value = "";
                                        } else {
                                            optionElement.value = selectValues[j];
                                        }
                                        optionElement.text = selectValues[j];
                                        depObj.options.add(optionElement);
                                    }
                                    depObj.value = selected_val;
                                }
                                if (!isload) {
                                    setDependent(depObj, false);
                                }
                                var jdepObj = jQuery(depObj);
                                if (jdepObj.hasClass("select2-hidden-accessible")) {
                                    jdepObj.trigger("change.select2");
                                }
                            }
                        }
                    }
                }
            }

            var zsWebFormMandatoryFields = new Array("First Name", "Contact Name", "Email", "Category", "Subject", "Description");
            var zsFieldsDisplayLabelArray = new Array("Nombres", "Apellidos", "Correo electrónico", "Categoria", "Asunto", "Descripción");

            function reformatAllDateFields() {
                const dateFields = document.querySelectorAll(".dob-field");
                dateFields.forEach((field) => {
                    if (field.value && field.value.includes("-")) {
                        const parts = field.value.split("-");
                        if (parts.length === 3) {
                            const [yyyy, mm, dd] = parts;
                            field.type = "text";
                            field.value = `${dd}/${mm}/${yyyy}`;
                        }
                    }
                });
            }

            function zsValidateMandatoryFields() {
                var isError = 0;
                for (var index = 0; index < zsWebFormMandatoryFields.length; index++) {
                    isError = 0;
                    var fieldObject = document.forms["zsWebToCase_553872000013503219"][zsWebFormMandatoryFields[index]];
                    if (fieldObject) {
                        if (fieldObject.value.replace(/^\s+|\s+$/g, "").length == 0) {
                            alert(zsFieldsDisplayLabelArray[index] + " no puede estar vacío.");
                            fieldObject.focus();
                            return false;
                        } else {
                            if (fieldObject.name == "Email") {
                                if (
                                    !fieldObject.value.match(
                                        /^([\w_][\w\-_.+\'&]*)@(?=.{4,256}$)(([\w]+)([\-_]*[\w])*[\.])+[a-zA-Z]{2,22}$/
                                    )
                                ) {
                                    alert("Introduzca una ID de correo electrónico válida.");
                                    fieldObject.focus();
                                    return false;
                                }
                            }
                        }
                        if (fieldObject.nodeName == "SELECT") {
                            if (
                                fieldObject.options[fieldObject.selectedIndex].value == "-None-" ||
                                fieldObject.options[fieldObject.selectedIndex].value == ""
                            ) {
                                alert(zsFieldsDisplayLabelArray[index] + " no puede ser nulo.");
                                fieldObject.focus();
                                return false;
                            }
                        }
                    }
                }
                reformatAllDateFields();
                document.getElementById("zsSubmitButton_553872000013503219").setAttribute("disabled", "disabled");
                return true;
            }

            var zsAttachedAttachmentsCount = 0;
            var zsAllowedAttachmentLimit = 4;
            var zsAttachmentFileBrowserIdsList = [1, 2, 3, 4, 5];

            function zsRenderBrowseFileAttachment(zsAttachmentObject, zsAttachmentDetails) {
                if (zsAttachmentObject != "") {
                    if (zsAttachmentDetails.files && zsAttachmentDetails.files[0].size / (1024 * 1024) > 20) {
                        zsAttachmentDetails.value = "";
                        alert("El tamaño de archivo máximo permitido es 20MB.");
                        return;
                    }
                    if (zsAttachedAttachmentsCount < 5) {
                        var zsFileName = "";
                        if (zsAttachmentObject.indexOf("\\") > -1) {
                            var zsAttachmentDataSplits = zsAttachmentObject.split("\\");
                            zsFileName = zsAttachmentDataSplits[zsAttachmentDataSplits.length - 1];
                        } else {
                            zsFileName = zsAttachmentObject;
                        }

                        var extension = zsFileName.split(".").pop().toLowerCase();
                        var unSupportedExtensions = [
                            "ade", "adp", "apk", "appx", "appxbundle", "bat", "cab", "cer", "chm", "cmd", "com", 
                            "cpl", "dll", "dmg", "exe", "hlp", "hta", "ins", "iso", "isp", "jar", "js", 
                            "jse", "lnk", "mde", "msc", "msi", "msix", "msixbundle", "msp", "mst", "nsh", 
                            "pif", "ps1", "pst", "reg", "scr", "sct", "shb", "sys", "tmp", "url", "vb", 
                            "vbe", "vbs", "vxd", "wsc", "wsf", "wsh", "terminal"
                        ];

                        if (unSupportedExtensions.indexOf(extension) != -1) {
                            alert("El archivo no se ha adjuntado porque su extensión no es compatible.");
                            return;
                        }

                        var zsCurrentAttachmentIdTokens = jQuery(zsAttachmentDetails).attr("id").split("_");
                        var zsCurrentAttachmentId = parseInt(zsCurrentAttachmentIdTokens[1]);
                        var zsAttachmentIdToBeRemoved = jQuery.inArray(zsCurrentAttachmentId, zsAttachmentFileBrowserIdsList);
                        zsAttachmentFileBrowserIdsList.splice(zsAttachmentIdToBeRemoved, 1);
                        var zsNextAttachmentId = zsAttachmentFileBrowserIdsList[0];
                        
                        jQuery("#zsattachment_" + zsCurrentAttachmentId).hide();
                        jQuery("#zsattachment_" + zsNextAttachmentId).show();

                        var safeFileName = jQuery("<div>").text(zsFileName).html();
                        jQuery("#zsFileBrowseAttachments").append(
                            '<div class="filenamecls" id="file_' +
                                zsCurrentAttachmentId +
                                '">' +
                                "<span>" + safeFileName + "</span>" +
                                '<a class="zsfilebrowseAttachment" href="javascript:void(0);" id="fileclose_' +
                                zsCurrentAttachmentId +
                                '">✕</a>' +
                                "</div>"
                        );

                        zsAttachedAttachmentsCount++;
                    }
                }
                zsChangeMousePointer();
            }

            jQuery(document)
                .off("click.fba")
                .on("click.fba", ".zsfilebrowseAttachment", function () {
                    var currentlyDeletedElement = jQuery(this).attr("id").split("_")[1];
                    jQuery("#zsattachment_" + currentlyDeletedElement).val("");
                    jQuery("#zsattachment_" + currentlyDeletedElement).replaceWith(
                        jQuery("#zsattachment_" + currentlyDeletedElement).clone()
                    );
                    jQuery(this).parent().remove();
                    zsAttachedAttachmentsCount = zsAttachedAttachmentsCount - 1;
                    zsAttachmentFileBrowserIdsList.push(parseInt(currentlyDeletedElement));
                    zsRearrangeFileBrowseAttachments();
                    zsChangeMousePointer();
                });

            function zsRearrangeFileBrowseAttachments() {
                jQuery.each(jQuery("input[type = file]"), function (fileIndex, fileObject) {
                    fileIndex = fileIndex + 1;
                    if (fileIndex == zsAttachmentFileBrowserIdsList[0]) {
                        jQuery("#zsattachment_" + fileIndex).show();
                    } else {
                        jQuery("#zsattachment_" + fileIndex).hide();
                    }
                });
            }

            function zsOpenFileBrowseAttachment(clickEvent) {
                if (zsAttachedAttachmentsCount >= 5) {
                    clickEvent.preventDefault();
                }
            }

            function zsChangeMousePointer() {
                if (zsAttachedAttachmentsCount >= 5) {
                    jQuery("#zsMaxLimitMessage").show();
                    jQuery("#zsattachment_1,#zsattachment_2,#zsattachment_3,#zsattachment_4,#zsattachment_5").hide();
                } else {
                    jQuery("#zsMaxLimitMessage").hide();
                    zsRearrangeFileBrowseAttachments();
                }
            }

jQuery(document).ready(function ($) {
                function matchCustom(params, data) {
                    if ($.trim(params.term) === "") {
                        return data;
                    }
                    if (typeof data.text === "undefined") {
                        return null;
                    }
                    function cleanText(text) {
                        return text
                            .toString()
                            .toLowerCase()
                            .normalize("NFD")
                            .replace(/[\u0300-\u036f]/g, "");
                    }
                    var optionText = cleanText(data.text);
                    var searchTerms = cleanText(params.term).split(/\s+/);
                    var matches = searchTerms.every(function (term) {
                        return optionText.indexOf(term) !== -1;
                    });
                    if (matches) {
                        return data;
                    }
                    return null;
                }

                $("#CASECF15").select2({
                    placeholder: "Escriba o busque su problema...",
                    allowClear: true,
                    width: "100%",
                    matcher: matchCustom,
                    language: {
                        noResults: function () {
                            return "No se encontraron coincidencias";
                        },
                        searching: function () {
                            return "Buscando...";
                        },
                    },
                });

                $("#Category").select2({
                    placeholder: "Seleccione o busque categoría...",
                    allowClear: true,
                    width: "100%",
                    matcher: matchCustom
                });

/* LÓGICA DE AUTOCOMPLETADO DE CATEGORÍA Y ASUNTO */
                $("#CASECF15").on("change select2:select select2:clear", function () {
                    var selectedProblem = $(this).val();
                    var depValueStr = $("#dependent_field_values_Cases").val();

                    if (depValueStr && selectedProblem && selectedProblem !== "--Ninguna--") {
                        // 1. Autocompletar Asunto con el problema seleccionado
                        $("#subject").val(selectedProblem);

                        // 2. Autocompletar Categoría según el JSON de dependencias
                        try {
                            var depData = JSON.parse(depValueStr);
                            if (depData && depData.JSON_VALUES) {
                                var categoryMapping = depData.JSON_VALUES.Category;
                                
                                if (categoryMapping && categoryMapping[selectedProblem]) {
                                    var matchedCategory = categoryMapping[selectedProblem];
                                    if (matchedCategory.length > 0) {
                                        $("#Category").val(matchedCategory[0]).trigger("change.select2");
                                        return;
                                    }
                                }
                            }
                        } catch (e) {
                            console.error("Error al procesar el JSON de dependencias:", e);
                        }

                        // Método de respaldo por extracción de prefijo (ej: "SARA - ...")
                        var prefix = selectedProblem.split(" - ")[0].trim();

        <script>
            document.addEventListener('DOMContentLoaded', function() {
                const fileInput = document.querySelector('.wtcuploadinput');

                if (fileInput) {
                    window.addEventListener('paste', function(e) {
                        const clipboardItems = e.clipboardData || window.clipboardData;
                        if (!clipboardItems) return;

                        let filesFound = [];

                        if (clipboardItems.items) {
                            for (let i = 0; i < clipboardItems.items.length; i++) {
                                if (clipboardItems.items[i].kind === 'file') {
                                    const file = clipboardItems.items[i].getAsFile();
                                    if (file) filesFound.push(file);
                                }
                            }
                        }

                        if (filesFound.length === 0 && clipboardItems.files && clipboardItems.files.length > 0) {
                            for (let j = 0; j < clipboardItems.files.length; j++) {
                                filesFound.push(clipboardItems.files[j]);
                            }
                        }

                        if (filesFound.length > 0) {
                            e.preventDefault();
                            e.stopPropagation();

                            const dataTransfer = new DataTransfer();
                            
                            if (fileInput.files) {
                                for (let k = 0; k < fileInput.files.length; k++) {
                                    dataTransfer.items.add(fileInput.files[k]);
                                }
                            }

                            filesFound.forEach(file => {
                                dataTransfer.items.add(file);
                            });

                            fileInput.files = dataTransfer.files;

                            fileInput.dispatchEvent(new Event('change', { bubbles: true }));
                            fileInput.dispatchEvent(new Event('input', { bubbles: true }));
                        }
                    }, true);
                }
            });
        </script>
